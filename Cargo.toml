[package]
name = "rust-api-client"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-rt = "2.15.0"
actix-web = "4.15.0"
awc = { version = "3.8.2", features = ["openssl"] }  # For native-tls support
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
#awc = { version = "3.8.2", features = ["rustls"] }      # For rustls support
tokio = { version = "1.53.1", features = ["full"] }

[package]
name = "rust-api-client"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
#awc = { version = "3.8.2", features = ["rustls"] }      # For rustls support
tokio = { version = "1.53.1", features = ["full"] }
